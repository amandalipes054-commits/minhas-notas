<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Notas</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f4f6f8;
  color:#1f2937;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h1{margin-top:0}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
  margin:6px 4px 0 0;
}

.primary{background:#2563eb;color:white}
.success{background:#16a34a;color:white}
.secondary{background:#e5e7eb}

.status{
  padding:11px;
  border-radius:9px;
  margin-top:12px;
  display:none;
}

.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:9px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
}

th:first-child,
td:first-child{
  text-align:left;
}

th{
  background:#f8fafc;
}

.pass{color:#15803d;font-weight:bold}
.warn{color:#b45309;font-weight:bold}
.fail{color:#dc2626;font-weight:bold}

.small{
  font-size:13px;
  color:#64748b;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:12px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>📚 Minhas Notas</h1>

<p>Preencha suas notas e salve seu perfil online.</p>

<div class="grid">

<div>
<label for="nome">Nome</label>
<input id="nome" type="text" placeholder="Digite seu nome">
</div>

<div>
<label for="codigo">Código pessoal (4 dígitos)</label>
<input
id="codigo"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Ex.: 4827">
</div>

</div>

<button class="primary" id="buscar">
🔎 Buscar notas preenchidas
</button>

<button class="success" id="salvar">
💾 Salvar alterações
</button>

<button class="secondary" id="novo">
🆕 Começar do zero
</button>

<div id="status" class="status"></div>

<p class="small">
Use seu nome e código de 4 dígitos para acessar seu perfil.
</p>

</div>


<div class="card">

<div class="table-wrap">

<table>

<thead>

<tr>
<th>Matéria</th>
<th>1º trimestre</th>
<th>2º trimestre</th>
<th>3º trimestre</th>
<th>Total</th>
<th>Situação</th>
</tr>

</thead>

<tbody id="tabela"></tbody>

</table>

</div>

</div>


<div class="card">

<h2>Resumo</h2>

<div id="resumo"></div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const URL_SUPABASE =
"https://gjgysqycnzifdzyydynt.supabase.co";

const CHAVE_SUPABASE =
"sb_publishable_N14PSKY8zB_Ul9Na3roSDg_9s5b8J4F";


const disciplinas = [

"Português",
"Inglês",
"Matemática",
"Ed. Financeira",
"Física",
"História",
"Sociologia",
"Filosofia",
"Informática",
"Comunicação e Vendas",
"Princípios Econômicos",
"Finanças",
"Liderança",
"RH",
"Marketing",
"Técnicas Integradas"

];


const sb = supabase.createClient(
URL_SUPABASE,
CHAVE_SUPABASE
);


const tabela =
document.getElementById("tabela");

const resumo =
document.getElementById("resumo");

const statusBox =
document.getElementById("status");


function mostrarStatus(msg,tipo="info"){

statusBox.textContent = msg;

statusBox.className =
"status " + tipo;

statusBox.style.display = "block";

}


function numero(valor){

const n = Number(valor);

return Number.isFinite(n) ? n : 0;

}


function normalizarNome(nome){

return nome
.trim()
.replace(/\s+/g," ")
.toLowerCase();

}


function criarTabela(){

tabela.innerHTML = "";

disciplinas.forEach((materia,i)=>{

const tr =
document.createElement("tr");

tr.innerHTML = `

<td>
<strong>${materia}</strong>
</td>

<td>
<input
class="nota"
data-i="${i}"
data-t="1"
type="number"
min="0"
max="100"
>
</td>

<td>
<input
class="nota"
data-i="${i}"
data-t="2"
type="number"
min="0"
max="100"
>
</td>

<td>
<input
class="nota"
data-i="${i}"
data-t="3"
type="number"
min="0"
max="100"
>
</td>

<td id="total-${i}">
0
</td>

<td id="sit-${i}">
—
</td>

`;

tabela.appendChild(tr);

});


document
.querySelectorAll(".nota")
.forEach(input=>{
input.addEventListener(
"input",
atualizarResumo
);
});


atualizarResumo();

}


function obterNotas(){

const notas =
disciplinas.map(()=>{
return [null,null,null];
});


document
.querySelectorAll(".nota")
.forEach(input=>{

const i =
Number(input.dataset.i);

const t =
Number(input.dataset.t)-1;

notas[i][t] =
input.value === ""
? null
: numero(input.value);

});


return notas;

}


function preencher(notas){

criarTabela();


document
.querySelectorAll(".nota")
.forEach(input=>{

const i =
Number(input.dataset.i);

const t =
Number(input.dataset.t)-1;

const valor =
notas?.[i]?.[t];

input.value =
valor === null ||
valor === undefined
? ""
: valor;

});


atualizarResumo();

}


function atualizarResumo(){

let aprovadas = 0;

let pendentes = 0;

let somaTotal = 0;


disciplinas.forEach((materia,i)=>{

const valores = [1,2,3].map(t=>{

const input =
document.querySelector(
`.nota[data-i="${i}"][data-t="${t}"]`
);

return input && input.value !== ""
? numero(input.value)
: 0;

});


const total =
valores.reduce(
(a,b)=>a+b,
0
);


document.getElementById(
"total-"+i
).textContent = total;


const situacao =
document.getElementById(
"sit-"+i
);


if(total >= 180){

situacao.textContent =
"Atingiu 180";

situacao.className =
"pass";

aprovadas++;

}else{

situacao.textContent =
"Faltam " + (180-total);

situacao.className =
total >= 140
? "warn"
: "fail";

pendentes++;

}


somaTotal += total;

});


resumo.innerHTML = `

<p>
<strong>${aprovadas}</strong>
matéria(s) já atingiram 180 pontos.
</p>

<p>
<strong>${pendentes}</strong>
matéria(s) ainda precisam de pontos.
</p>

<p>
Soma dos totais:
<strong>${somaTotal}</strong>
</p>

`;

}


function validar(){

const nome =
document.getElementById("nome")
.value
.trim();

const codigo =
document.getElementById("codigo")
.value
.trim();


if(!nome){

mostrarStatus(
"Digite seu nome.",
"err"
);

return null;

}


if(!/^\d{4}$/.test(codigo)){

mostrarStatus(
"O código deve ter exatamente 4 dígitos.",
"err"
);

return null;

}


return {
nome:nome,
codigo:codigo
};

}


/* SALVAR */

document
.getElementById("salvar")
.addEventListener(
"click",
async()=>{

const dados =
validar();

if(!dados)return;


mostrarStatus(
"Salvando notas online...",
"info"
);


const payload = {

nome:dados.nome,

nome_busca:
normalizarNome(dados.nome),

codigo:dados.codigo,

notas:obterNotas(),

atualizado_em:
new Date().toISOString()

};


const {error} =
await sb
.from("notas_alunos")
.upsert(
payload,
{
onConflict:
"nome_busca,codigo"
}
);


if(error){

console.error(error);

mostrarStatus(
"Erro ao salvar: "
+ error.message,
"err"
);

return;

}


mostrarStatus(
"Notas salvas com sucesso!",
"ok"
);

});


/* BUSCAR */

document
.getElementById("buscar")
.addEventListener(
"click",
async()=>{

const dados =
validar();

if(!dados)return;


mostrarStatus(
"Buscando suas notas...",
"info"
);


const {data,error} =
await sb
.from("notas_alunos")
.select("nome,notas")
.eq(
"nome_busca",
normalizarNome(dados.nome)
)
.eq(
"codigo",
dados.codigo
)
.maybeSingle();


if(error){

console.error(error);

mostrarStatus(
"Erro ao buscar: "
+ error.message,
"err"
);

return;

}


if(!data){

mostrarStatus(
"Nenhum perfil encontrado com esse nome e código.",
"err"
);

return;

}


preencher(data.notas);


document.getElementById("nome")
.value = data.nome;


mostrarStatus(
"Notas encontradas e carregadas!",
"ok"
);

});


/* COMEÇAR DO ZERO */

document
.getElementById("novo")
.addEventListener(
"click",
()=>{

document.getElementById("nome")
.value = "";

document.getElementById("codigo")
.value = "";


preencher(
disciplinas.map(()=>{
return [null,null,null];
})
);


mostrarStatus(
"Tabela limpa. Você pode começar do zero.",
"info"
);

});


criarTabela();

</script>

</body>
</html>
